<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Agent</title>
<style>
:root {
  --bg: #f1f5f9;
  --card: #ffffff;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --ok: #16a34a;
  --bad: #dc2626;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
}
* { box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 24px 16px 48px;
}
.container { max-width: 960px; margin: 0 auto; }
header { margin-bottom: 24px; }
h1 { font-size: 1.75rem; margin: 0 0 6px; }
.subtitle { color: var(--muted); margin: 0; }
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  border: 1px solid var(--border);
}
.card h3 { margin: 0 0 14px; font-size: 1.1rem; }
label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
input, textarea, select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 12px;
  background: #fff;
}
textarea { min-height: 90px; resize: vertical; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 180px; }
button {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}
button:hover { background: var(--primary-hover); }
button:disabled { background: #94a3b8; cursor: not-allowed; }
button.secondary { background: #475569; }
pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 14px;
  border-radius: 10px;
  overflow: auto;
  font-size: 13px;
  white-space: pre-wrap;
  margin: 10px 0 0;
}
.item {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  background: #f8fafc;
}
.item:hover { background: #eff6ff; border-color: #bfdbfe; }
.badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: #e2e8f0;
  margin-right: 6px;
}
.ok { color: var(--ok); font-weight: 600; }
.bad { color: var(--bad); font-weight: 600; }
.status-bar {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Trend Agent</h1>
    <p class="subtitle">Quét MediaCrawler → Chuẩn hóa → Chấm điểm (Jev / laya-mlx) → Lưu DB → Phân tích</p>
  </header>

  <div class="card">
    <h3>1. Quét dữ liệu đã crawl</h3>
    <button onclick="scan()">Quét thư mục MediaCrawler/data</button>
    <div class="status-bar" id="scanStatus">Chưa quét</div>
    <div id="itemList" style="margin-top:12px;"></div>
  </div>

  <div class="card">
    <h3>2. Chấm điểm & Lưu nếu đạt</h3>
    <div class="row">
      <div>
        <label>Domain</label>
        <input id="domain" value="grocery">
      </div>
      <div>
        <label>API Key Jev (để trống nếu dùng laya-mlx)</label>
        <input id="apiKey" type="password" placeholder="TYPESAFE_API_KEY">
      </div>
    </div>
    <label>Nội dung sản phẩm / xu hướng</label>
    <textarea id="item" placeholder="Chọn từ danh sách trên hoặc dán mô tả..."></textarea>
    <input type="hidden" id="source" value="manual">
    <button onclick="doScore()">Chấm điểm & Lưu nếu đạt</button>
    <pre id="scoreOut">Kết quả sẽ hiện ở đây</pre>
    <div style="margin-top:12px;">
      <button id="btnAnalyze" onclick="doAnalyze()" disabled>Phân tích & Lưu</button>
    </div>
    <pre id="analyzeOut"></pre>
  </div>

  <div class="card">
    <h3>3. Dữ liệu đã lưu trong DB</h3>
    <button class="secondary" onclick="loadSaved()">Tải danh sách đã lưu</button>
    <pre id="savedOut">Bấm để xem</pre>
  </div>
</div>

<script>
let lastId = null;
let lastScores = null;
let lastItem = "";

async function scan() {
  const status = document.getElementById("scanStatus");
  status.textContent = "Đang quét...";
  try {
    const r = await fetch("/api/scan");
    const d = await r.json();
    status.textContent = `Tìm thấy ${d.count} item` + (d.laya_available ? " • laya-mlx sẵn sàng" : "");
    const list = document.getElementById("itemList");
    list.innerHTML = "";
    (d.items || []).forEach(it => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `<span class="badge">${it.source}</span>${it.name}`;
      div.onclick = () => {
        document.getElementById("item").value = it.description || it.name;
        document.getElementById("source").value = it.source;
      };
      list.appendChild(div);
    });
    if (!d.items || d.items.length === 0) {
      list.innerHTML = "<p style='color:#64748b'>Không có dữ liệu. Hãy chạy MediaCrawler trước hoặc dán nội dung thủ công.</p>";
    }
  } catch (e) {
    status.textContent = "Lỗi: " + e.message;
  }
}

async function doScore() {
  const el = document.getElementById("scoreOut");
  el.textContent = "Đang chấm điểm...";
  lastItem = document.getElementById("item").value.trim();
  if (!lastItem) { el.textContent = "Vui lòng nhập nội dung."; return; }
  try {
    const r = await fetch("/api/score", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        item: lastItem,
        domain: document.getElementById("domain").value,
        source: document.getElementById("source").value,
        api_key: document.getElementById("apiKey").value || null
      })
    });
    const d = await r.json();
    lastScores = d.answers;
    lastId = d.item_id;
    const badge = d.passed
      ? `<span class="ok">ĐẠT & ĐÃ LƯU</span> (model: ${d.model || "jev"})`
      : `<span class="bad">KHÔNG ĐẠT</span>`;
    el.innerHTML = badge + "\n\n" + JSON.stringify(d, null, 2);
    document.getElementById("btnAnalyze").disabled = !d.passed;
  } catch (e) {
    el.textContent = "Lỗi: " + e.message;
  }
}

async function doAnalyze() {
  const el = document.getElementById("analyzeOut");
  el.textContent = "Đang phân tích...";
  try {
    const r = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item_id: lastId, item: lastItem, scores: lastScores })
    });
    const d = await r.json();
    el.textContent = d.analysis + "\n\n--- Preview Telegram ---\n" + d.telegram;
  } catch (e) {
    el.textContent = "Lỗi: " + e.message;
  }
}

async function loadSaved() {
  const el = document.getElementById("savedOut");
  el.textContent = "Đang tải...";
  try {
    const r = await fetch("/api/saved");
    const d = await r.json();
    el.textContent = JSON.stringify(d.items, null, 2);
  } catch (e) {
    el.textContent = "Lỗi: " + e.message;
  }
}
</script>
</body>
</html>
